<svg xmlns="http://www.w3.org/2000/svg" width="520" height="134" viewBox="0 0 780 200" role="img">
  <title>DXP AI – ZensAI by Zensar Technologies</title>
  <desc>DXP AI logo with blue-to-purple gradient letterforms, pixel scatter effect, and ZensAI sparkle orbit. Transparent background for dark headers.</desc>
  <defs>
    <!-- D and P body: deep navy -->
    <linearGradient id="gNavy" x1="0%" y1="0%" x2="10%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0D0E2A"/>
    </linearGradient>
    <!-- X main gradient: blue → purple -->
    <linearGradient id="gX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <!-- X secondary: vivid blue → purple -->
    <linearGradient id="gX2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <!-- "Zens" text: light lavender-white -->
    <linearGradient id="gZens" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8FF"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <!-- "AI" text: purple → cyan -->
    <linearGradient id="gAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <!-- Orbit arc stroke -->
    <linearGradient id="gOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Sparkle star -->
    <linearGradient id="gSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <!-- ═══════════════════════════════════════════
       PIXEL SCATTER  — bursting left from the D
       ═══════════════════════════════════════════ -->
  <!-- Row 1 — brightest inner squares -->
  <rect x="6"  y="50" width="12" height="12" rx="2" fill="#2563EB" opacity="1.00"/>
  <rect x="22" y="36" width="11" height="11" rx="2" fill="#3B82F6" opacity="0.95"/>
  <rect x="22" y="50" width="11" height="11" rx="2" fill="#2563EB" opacity="0.90"/>
  <rect x="22" y="64" width="11" height="11" rx="2" fill="#5B21B6" opacity="0.92"/>
  <rect x="6"  y="64" width="11" height="11" rx="2" fill="#7C3AED" opacity="0.85"/>
  <rect x="6"  y="78" width="11" height="11" rx="2" fill="#7C3AED" opacity="0.80"/>
  <rect x="22" y="78" width="11" height="11" rx="2" fill="#9333EA" opacity="0.78"/>
  <rect x="22" y="92" width="10" height="10" rx="2" fill="#A855F7" opacity="0.72"/>
  <rect x="6"  y="92" width="10" height="10" rx="2" fill="#8B5CF6" opacity="0.68"/>
  <!-- Row 2 — mid distance -->
  <rect x="37" y="24" width="10" height="10" rx="2" fill="#60A5FA" opacity="0.80"/>
  <rect x="37" y="38" width="10" height="10" rx="2" fill="#3B82F6" opacity="0.72"/>
  <rect x="37" y="105" width="10" height="10" rx="2" fill="#A855F7" opacity="0.65"/>
  <rect x="37" y="119" width="9"  height="9"  rx="2" fill="#C084FC" opacity="0.55"/>
  <!-- Row 3 — further scatter -->
  <rect x="52" y="16" width="8" height="8" rx="1.5" fill="#93C5FD" opacity="0.65"/>
  <rect x="52" y="30" width="8" height="8" rx="1.5" fill="#60A5FA" opacity="0.55"/>
  <rect x="52" y="114" width="7" height="7" rx="1.5" fill="#C084FC" opacity="0.50"/>
  <rect x="52" y="127" width="7" height="7" rx="1.5" fill="#D8B4FE" opacity="0.42"/>
  <!-- Row 4 — distant tiny dots -->
  <rect x="65" y="10" width="6" height="6" rx="1" fill="#BFDBFE" opacity="0.42"/>
  <rect x="65" y="122" width="6" height="6" rx="1" fill="#E9D5FF" opacity="0.38"/>
  <rect x="78" y="18" width="5" height="5" rx="1" fill="#DBEAFE" opacity="0.34"/>
  <rect x="78" y="116" width="5" height="5" rx="1" fill="#F3E8FF" opacity="0.30"/>
  <rect x="90" y="26" width="4" height="4" rx="1" fill="#EFF6FF" opacity="0.26"/>
  <rect x="90" y="110" width="4" height="4" rx="1" fill="#FAF5FF" opacity="0.22"/>

  <!-- ═══════════════════════════════════════════
       D  — deep navy rounded slab
       ═══════════════════════════════════════════ -->
  <!-- Outer D shape -->
  <path d="M108 26 L130 26 Q182 26 182 100 Q182 148 130 148 L108 148 Z" fill="url(#gNavy)"/>
  <!-- Inner cutout -->
  <path d="M126 50 L132 50 Q158 50 158 100 Q158 122 132 122 L126 122 Z" fill="#07081A"/>

  <!-- ═══════════════════════════════════════════
       X  — two crossing gradient bars
       ═══════════════════════════════════════════ -->
  <!-- Bar 1: top-left to bottom-right (cyan→purple) -->
  <polygon points="196,26 222,26 278,148 252,148" fill="url(#gX)"/>
  <!-- Bar 2: top-right to bottom-left (blue→magenta) -->
  <polygon points="278,26 252,26 196,148 222,148" fill="url(#gX2)"/>
  <!-- Centre diamond re-draw to unify overlap -->
  <polygon points="237,80 252,55 265,80 252,105" fill="url(#gX)"/>

  <!-- ═══════════════════════════════════════════
       P  — deep navy slab with bowl cutout
       ═══════════════════════════════════════════ -->
  <!-- Stem -->
  <rect x="300" y="26" width="26" height="122" rx="4" fill="url(#gNavy)"/>
  <!-- Bowl outer -->
  <path d="M300 26 L348 26 Q392 26 392 76 Q392 120 348 120 L300 120 Z" fill="url(#gNavy)"/>
  <!-- Bowl cutout -->
  <path d="M322 50 L346 50 Q368 50 368 76 Q368 96 346 96 L322 96 Z" fill="#07081A"/>

  <!-- ═══════════════════════════════════════════
       "Zens" — light lavender
       ═══════════════════════════════════════════ -->
  <text
    x="414" y="114"
    font-family="'Sora','Segoe UI',Arial,sans-serif"
    font-size="62"
    font-weight="700"
    letter-spacing="-1.5"
    fill="url(#gZens)">Zens</text>

  <!-- "AI" — vivid gradient -->
  <text
    x="568" y="114"
    font-family="'Sora','Segoe UI',Arial,sans-serif"
    font-size="62"
    font-weight="800"
    letter-spacing="-1"
    fill="url(#gAI)">AI</text>

  <!-- ═══════════════════════════════════════════
       Orbit arcs around ZensAI block
       ═══════════════════════════════════════════ -->
  <!-- Top arc -->
  <path d="M 420 46 A 148 58 0 0 1 698 104"
        fill="none"
        stroke="url(#gOrbit)"
        stroke-width="2"
        stroke-linecap="round"
        opacity="0.80"/>
  <!-- Bottom arc -->
  <path d="M 420 152 A 148 58 0 0 0 698 104"
        fill="none"
        stroke="url(#gOrbit)"
        stroke-width="1.6"
        stroke-linecap="round"
        opacity="0.55"/>
  <!-- Arc endpoint dots -->
  <circle cx="420" cy="46"  r="3.8" fill="#7C3AED" opacity="0.90"/>
  <circle cx="698" cy="104" r="3.8" fill="#06B6D4" opacity="0.90"/>
  <circle cx="420" cy="152" r="3.2" fill="#9333EA" opacity="0.65"/>

  <!-- ═══════════════════════════════════════════
       4-point sparkle star  (right side of orbit)
       ═══════════════════════════════════════════ -->
  <g transform="translate(654,68)">
    <!-- Long vertical ray -->
    <ellipse cx="0" cy="-13" rx="2.5" ry="12" fill="url(#gSpark)" opacity="0.95"/>
    <ellipse cx="0" cy="13"  rx="2.5" ry="12" fill="url(#gSpark)" opacity="0.95"/>
    <!-- Long horizontal ray -->
    <ellipse cx="-13" cy="0" rx="12" ry="2.5" fill="url(#gSpark)" opacity="0.95"/>
    <ellipse cx="13"  cy="0" rx="12" ry="2.5" fill="url(#gSpark)" opacity="0.95"/>
    <!-- Short diagonal rays -->
    <ellipse cx="-7" cy="-7" rx="1.2" ry="5" transform="rotate(-45,-7,-7)" fill="url(#gSpark)" opacity="0.50"/>
    <ellipse cx="7"  cy="-7" rx="1.2" ry="5" transform="rotate(45,7,-7)"   fill="url(#gSpark)" opacity="0.50"/>
    <ellipse cx="-7" cy="7"  rx="1.2" ry="5" transform="rotate(45,-7,7)"   fill="url(#gSpark)" opacity="0.50"/>
    <ellipse cx="7"  cy="7"  rx="1.2" ry="5" transform="rotate(-45,7,7)"   fill="url(#gSpark)" opacity="0.50"/>
    <!-- Bright centre -->
    <circle cx="0" cy="0" r="3.8" fill="#FFFFFF" opacity="1.00"/>
    <circle cx="0" cy="0" r="1.8" fill="#E0F2FE" opacity="1.00"/>
  </g>

  <!-- ═══════════════════════════════════════════
       "POWERED BY ZENSAR TECHNOLOGIES" sub-label
       ═══════════════════════════════════════════ -->
  <text
    x="414" y="156"
    font-family="'DM Sans','Segoe UI',Arial,sans-serif"
    font-size="12"
    font-weight="400"
    letter-spacing="0.10em"
    fill="#6B7AAB">POWERED BY ZENSAR TECHNOLOGIES</text>
</svg>
